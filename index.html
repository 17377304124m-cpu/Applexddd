<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>明军的主页</title>

  <!-- iOS 添加到主屏幕支持 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="明军">
  <meta name="theme-color" content="#f4f5f1">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <!-- ============ 主页 ============ -->
    <main id="page-home" class="page active">
      <header class="profile">
        <img class="avatar" src="avatar.png" alt="头像">
        <div class="profile-info">
          <h1 id="profile-name" class="profile-name">明军</h1>
          <p id="profile-tagline" class="profile-tagline">保持好奇，持续行动</p>
        </div>
        <button id="profile-edit-btn" class="icon-btn" title="编辑资料" aria-label="编辑资料">
          <svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        </button>
      </header>

      <section class="bio-section">
        <p id="profile-bio" class="bio">这里是个人简介。点击右上角铅笔可以修改名字、签名和这段介绍，内容会保存在本地。</p>
      </section>

      <section class="links-section">
        <h2 class="section-title">常用链接</h2>
        <ul id="link-list" class="link-list"></ul>
        <form id="link-form" class="inline-form">
          <input id="link-title" type="text" placeholder="名称" maxlength="20" required>
          <input id="link-url" type="url" placeholder="https://" required>
          <button type="submit" class="icon-btn accent" title="添加链接" aria-label="添加链接">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </form>
      </section>
    </main>

    <!-- ============ 工具页 ============ -->
    <main id="page-tools" class="page">
      <div class="segmented" role="tablist">
        <button class="segment active" data-tool="todo" role="tab" title="待办清单">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></svg>
          <span>待办</span>
        </button>
        <button class="segment" data-tool="note" role="tab" title="便签">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>
          <span>便签</span>
        </button>
        <button class="segment" data-tool="pomodoro" role="tab" title="番茄钟">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
          <span>番茄钟</span>
        </button>
      </div>

      <!-- 待办 -->
      <section id="tool-todo" class="tool-panel active">
        <form id="todo-form" class="inline-form">
          <input id="todo-input" type="text" placeholder="要做点什么？" maxlength="80" required>
          <button type="submit" class="icon-btn accent" title="添加待办" aria-label="添加待办">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </form>
        <ul id="todo-list" class="item-list"></ul>
      </section>

      <!-- 便签 -->
      <section id="tool-note" class="tool-panel">
        <form id="note-form" class="note-form">
          <textarea id="note-input" rows="3" placeholder="随手记一笔…" maxlength="500" required></textarea>
          <button type="submit" class="btn primary">保存便签</button>
        </form>
        <ul id="note-list" class="item-list"></ul>
      </section>

      <!-- 番茄钟 -->
      <section id="tool-pomodoro" class="tool-panel">
        <div class="pomo">
          <div class="pomo-modes segmented">
            <button class="segment active" data-minutes="25">专注 25</button>
            <button class="segment" data-minutes="5">短休 5</button>
            <button class="segment" data-minutes="15">长休 15</button>
          </div>
          <div class="pomo-ring-wrap">
            <svg class="pomo-ring" viewBox="0 0 200 200">
              <circle class="ring-bg" cx="100" cy="100" r="88"/>
              <circle id="ring-progress" class="ring-progress" cx="100" cy="100" r="88"/>
            </svg>
            <div id="pomo-time" class="pomo-time">25:00</div>
          </div>
          <div class="pomo-controls">
            <button id="pomo-toggle" class="icon-btn large accent" title="开始 / 暂停" aria-label="开始或暂停">
              <svg id="pomo-icon-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="currentColor" stroke="none"/></svg>
              <svg id="pomo-icon-pause" viewBox="0 0 24 24" class="hidden"><rect x="6" y="4" width="4" height="16" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" fill="currentColor" stroke="none"/></svg>
            </button>
            <button id="pomo-reset" class="icon-btn large" title="重置" aria-label="重置">
              <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
          </div>
          <p class="pomo-count">已完成 <strong id="pomo-count">0</strong> 个专注</p>
        </div>
      </section>
    </main>

    <!-- ============ 底部标签栏 ============ -->
    <nav class="tabbar">
      <button class="tab active" data-page="home" title="主页">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
        <span>主页</span>
      </button>
      <button class="tab" data-page="tools" title="工具">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span>工具</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
